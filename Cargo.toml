[package]
name = "stb_image_write_nrp"
description = "PNG, BMP and JPEG writers in pure, safe Rust: a native port of stb_image_write.h, bit-identical to it."
version = "0.2.1"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Unlicense"
repository = "https://github.com/OctoKeights/stb_image_write_nrp"
readme = "README.md"
keywords = ["png", "jpeg", "bmp", "image", "stb"]
categories = ["multimedia::images", "encoding"]

[dependencies]

[dev-dependencies]
miniz_nrp = { version = "0.2.0", git = "https://github.com/OctoKeights/miniz_nrp" }

[lints.rust]
# No unsafe code in the library, its tests, examples or benchmarks.
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Integer and float conversions that narrow or reinterpret are the codec's arithmetic, as they
# are in the original's C; each is deliberate, so these four are not flagged.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
